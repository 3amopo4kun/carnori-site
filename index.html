<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020202">
  <title>CARNORI | Скоро запуск</title>
  <meta name="description" content="CARNORI — новый взгляд на обслуживание автомобиля — скоро запуск">
  <link rel="canonical" href="https://carnori.ru/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="CARNORI | Скоро запуск">
  <meta property="og:description" content="Новый взгляд на обслуживание автомобиля">
  <meta property="og:url" content="https://carnori.ru/">
  <meta property="og:image" content="https://carnori.ru/hero-approved.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="site-shell" aria-label="CARNORI">
    <canvas id="particles" class="particles" aria-hidden="true"></canvas>

    <div class="scene" aria-hidden="true">
      <div class="layer base-glow"></div>
      <div class="layer haze haze-a"></div>
      <div class="layer haze haze-b"></div>
      <div class="layer spotlight"></div>

      <div class="layer mesh mesh-left"></div>
      <div class="layer mesh mesh-right"></div>

      <div class="ray-field ray-field-back">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="ray-field ray-field-mid">
        <i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="ray-field ray-field-front">
        <i></i><i></i><i></i><i></i>
      </div>

      <div class="mobile-orbit"></div>
      <div class="floor-reflection"></div>
      <div class="vignette"></div>
    </div>

    <section class="hero" aria-labelledby="hero-title">
      <div class="logo-stage intro intro-1" role="img" aria-label="CARNORI CN">
        <div class="logo-aura" aria-hidden="true"></div>
        <img
          class="monogram-image"
          src="cn-logo-gold-transparent.webp"
          alt=""
          width="700"
          height="539"
          decoding="sync"
          fetchpriority="high"
          aria-hidden="true"
        >
      </div>

      <div class="brand-lockup intro intro-2" aria-label="CARNORI">
        <img class="brand-wordmark" src="carnori-wordmark.png" alt="CARNORI" width="980" height="126" decoding="sync">
      </div>
      <div class="brand-rule intro intro-3" aria-hidden="true">
        <span></span><b></b><span></span>
      </div>

      <div class="copy-block">
        <h1 id="hero-title" class="intro intro-4">Скоро запуск</h1>
        <p class="subtitle intro intro-5">Новый взгляд на обслуживание автомобиля</p>

        <div class="ornament intro intro-6" aria-hidden="true">
          <span></span><b></b><span></span>
        </div>

        <p class="tagline intro intro-7">Driven by precision</p>
      </div>

      <div class="horizon-wrap intro intro-8" aria-hidden="true">
        <div class="horizon-glow"></div>
        <div class="horizon-line"></div>
      </div>

      <a class="domain intro intro-9" href="https://carnori.ru/">carnori.ru</a>
    </section>

    <button class="tester-entry" id="tester-entry" type="button" aria-haspopup="dialog" aria-controls="tester-portal">
      <span class="tester-entry-dot" aria-hidden="true"></span>
      ТЕСТ
    </button>

    <section class="tester-portal" id="tester-portal" aria-hidden="true">
      <div class="tester-backdrop" data-tester-close></div>
      <div class="tester-panel" role="dialog" aria-modal="true" aria-labelledby="tester-title">
        <button class="tester-close" type="button" data-tester-close aria-label="Закрыть">×</button>

        <div class="tester-brand">
          <span class="tester-eyebrow">CARNORI EARLY ACCESS</span>
          <h2 id="tester-title">Закрытое тестирование</h2>
          <p>Доступ к APK выдаётся только после подтверждения заявки</p>
        </div>

        <div class="tester-status" id="tester-status" role="status" aria-live="polite">Подключение к CARNORI…</div>

        <div class="tester-view" id="tester-auth-view" hidden>
          <form id="tester-phone-form" class="tester-form" novalidate>
            <label class="tester-label" for="tester-phone">Номер телефона</label>
            <input class="tester-input" id="tester-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 999 123-45-67" maxlength="24" required>

            <div class="tester-legal">
              <label><input id="tester-terms" type="checkbox"> <span>Принимаю <a href="https://api.carnori.ru/legal/terms" target="_blank" rel="noopener">Пользовательское соглашение</a></span></label>
              <label><input id="tester-privacy" type="checkbox"> <span>Ознакомлен с <a href="https://api.carnori.ru/legal/privacy" target="_blank" rel="noopener">Политикой обработки персональных данных</a></span></label>
              <label><input id="tester-consent" type="checkbox"> <span>Даю отдельное <a href="https://api.carnori.ru/legal/consent" target="_blank" rel="noopener">Согласие на обработку персональных данных</a></span></label>
              <label><input id="tester-age" type="checkbox"> <span>Мне исполнилось 18 лет</span></label>
            </div>

            <button class="tester-primary" id="tester-request-code" type="submit">Получить код</button>
          </form>

          <form id="tester-code-form" class="tester-form tester-code-form" hidden novalidate>
            <p class="tester-code-note" id="tester-code-note"></p>
            <label class="tester-label" for="tester-code">Код из SMS</label>
            <input class="tester-input tester-code-input" id="tester-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
            <button class="tester-primary" type="submit">Подтвердить номер</button>
            <button class="tester-link-button" id="tester-change-phone" type="button">Изменить номер</button>
          </form>
        </div>

        <div class="tester-view" id="tester-account-view" hidden>
          <div class="tester-account-head">
            <div>
              <span class="tester-caption">ТЕСТИРОВЩИК</span>
              <strong id="tester-phone-masked">—</strong>
            </div>
            <button class="tester-link-button" id="tester-logout" type="button">Выйти</button>
          </div>

          <div class="tester-request-card" id="tester-request-card"></div>
          <button class="tester-primary" id="tester-request-apk" type="button" hidden>Запросить доступ к APK</button>
          <a class="tester-primary tester-download" id="tester-download-apk" href="https://api.carnori.ru/api/v1/testers/apk/download" hidden>Скачать CARNORI APK</a>
        </div>

        <div class="tester-footer">
          <span>Поддержка</span>
          <a id="tester-support-email" href="mailto:carnori@mail.ru">carnori@mail.ru</a>
        </div>
      </div>
    </section>

    <div class="intro-flare" aria-hidden="true"></div>
    <div class="film-grain" aria-hidden="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
